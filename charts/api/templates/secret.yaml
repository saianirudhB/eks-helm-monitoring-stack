{{/*
This Secret is only rendered when .Values.secrets.create is true (the default).

IMPORTANT — do not commit real secret material into this chart's values files.
At install/upgrade time, override these keys from the CLI or a CI secret store, e.g.:

  helm upgrade --install api charts/api \
    --set secrets.DJANGO_SECRET_KEY="$(openssl rand -hex 32)" \
    --set secrets.DATABASE_URL="postgres://user:pass@host:5432/db"

For production, prefer managing this Secret outside of Helm entirely — e.g. with the
External Secrets Operator syncing from AWS Secrets Manager / SSM Parameter Store, or
the AWS Secrets & Configuration Provider for the Secrets Store CSI Driver — and set
secrets.create: false plus secrets.externalSecretName to point this chart at that
externally managed Secret instead.
*/}}
{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "api.fullname" . }}
  labels:
    {{- include "api.labels" . | nindent 4 }}
type: Opaque
stringData:
  DJANGO_SECRET_KEY: {{ .Values.secrets.DJANGO_SECRET_KEY | quote }}
  DATABASE_URL: {{ .Values.secrets.DATABASE_URL | quote }}
{{- end }}
