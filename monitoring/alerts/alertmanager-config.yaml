# Example Alertmanager configuration: routes `severity: critical` alerts to
# Slack and `severity: warning` alerts to email, with grouping/repeat
# intervals tuned to avoid paging fatigue for a small team.
#
# This is supplied to the kube-prometheus-stack chart's built-in Alertmanager
# as a Secret (the format Alertmanager expects). Apply it with:
#
#   kubectl create secret generic alertmanager-kube-prometheus-stack-alertmanager \
#     --from-file=alertmanager.yaml=monitoring/alerts/alertmanager-config.yaml \
#     -n monitoring --dry-run=client -o yaml | kubectl apply -f -
#
# NOTE: replace the Slack webhook URL and SMTP credentials below with real
# values pulled from a secret manager at deploy time — never commit real
# webhook URLs or SMTP passwords here.

global:
  resolve_timeout: 5m
  slack_api_url: "<SLACK_WEBHOOK_URL>" # injected at deploy time from a secret manager, never committed
  smtp_smarthost: "smtp.example.com:587"
  smtp_from: "alertmanager@example.com"
  smtp_auth_username: "alertmanager@example.com"
  smtp_auth_password: "CHANGEME-use-a-secret-manager"
  smtp_require_tls: true

route:
  receiver: "default-email"
  group_by: ["alertname", "namespace"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = "critical"
      receiver: "slack-critical"
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 1h
      continue: false

    - matchers:
        - severity = "warning"
      receiver: "email-warnings"
      group_wait: 1m
      group_interval: 10m
      repeat_interval: 6h
      continue: false

receivers:
  - name: "default-email"
    email_configs:
      - to: "platform-team@example.com"
        send_resolved: true

  - name: "slack-critical"
    slack_configs:
      - channel: "#alerts-critical"
        send_resolved: true
        title: '{{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})'
        text: >-
          {{ range .Alerts }}
          *{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          {{ end }}
        username: "alertmanager"
        icon_emoji: ":rotating_light:"

  - name: "email-warnings"
    email_configs:
      - to: "platform-team@example.com"
        send_resolved: true
        headers:
          subject: '[WARNING] {{ .CommonLabels.alertname }} in {{ .CommonLabels.namespace }}'

inhibit_rules:
  # If a pod is already crash looping / not ready (critical), don't also page
  # on high CPU/memory for the same pod — the crash alert is the actionable one.
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ["namespace", "pod"]
