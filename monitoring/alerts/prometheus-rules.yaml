# PrometheusRule custom resource (requires the Prometheus Operator CRDs,
# installed by the kube-prometheus-stack chart). Because
# monitoring/kube-prometheus-stack-values.yaml sets ruleSelectorNilUsesHelmValues
# to false, Prometheus picks this rule up from any namespace without needing a
# matching label — apply it directly:
#
#   kubectl apply -f monitoring/alerts/prometheus-rules.yaml -n monitoring
#
# Metrics referenced below come from three standard exporters bundled with
# kube-prometheus-stack: kube-state-metrics (kube_pod_*, kube_horizontal...),
# cAdvisor via the kubelet (container_cpu_*, container_memory_*), and
# node-exporter (node_cpu_seconds_total).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: api-alert-rules
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/part-of: eks-helm-monitoring-stack
spec:
  groups:
    - name: api.pods
      rules:
        - alert: PodCrashLooping
          expr: |
            max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[5m]) >= 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash looping"
            description: >-
              Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }}
              has been in CrashLoopBackOff for at least 5 minutes. Check recent logs with
              `kubectl logs -n {{ $labels.namespace }} {{ $labels.pod }} -c {{ $labels.container }} --previous`.

        - alert: PodNotReady
          expr: |
            sum by (namespace, pod) (
              max by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Unknown|Failed"})
            ) > 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has not been Ready for 15 minutes"
            description: >-
              Pod {{ $labels.namespace }}/{{ $labels.pod }} has been in a non-ready phase
              (Pending, Unknown or Failed) for more than 15 minutes. Check scheduling and
              readiness probe status with `kubectl describe pod -n {{ $labels.namespace }} {{ $labels.pod }}`.

    - name: api.resource-usage
      rules:
        - alert: HighCPUUsage
          expr: |
            (
              sum by (namespace, pod, container) (rate(container_cpu_usage_seconds_total{image!="", container!=""}[5m]))
              /
              sum by (namespace, pod, container) (kube_pod_container_resource_limits{resource="cpu"})
            ) > 0.85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }} is CPU-throttled"
            description: >-
              Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }}
              has used over 85% of its CPU limit for 10 minutes. Current value: {{ $value | humanizePercentage }}.
              Consider raising resources.limits.cpu or checking the HPA (kubectl get hpa -n {{ $labels.namespace }}).

        - alert: HighNodeCPUUsage
          expr: |
            100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Node {{ $labels.instance }} CPU usage is above 85%"
            description: >-
              Node {{ $labels.instance }} has averaged over 85% CPU utilization for 10 minutes
              (current: {{ $value | printf "%.1f" }}%). Check for noisy-neighbor pods or consider
              scaling the EKS managed node group.

        - alert: HighMemoryUsage
          expr: |
            (
              sum by (namespace, pod, container) (container_memory_working_set_bytes{image!="", container!=""})
              /
              sum by (namespace, pod, container) (kube_pod_container_resource_limits{resource="memory"})
            ) > 0.9
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }} is near its memory limit"
            description: >-
              Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }}
              has used over 90% of its memory limit for 10 minutes (current: {{ $value | humanizePercentage }}).
              It is at risk of being OOMKilled; consider raising resources.limits.memory.

    - name: api.autoscaling
      rules:
        - alert: HPAMaxedOut
          expr: |
            kube_horizontalpodautoscaler_status_current_replicas
              >= kube_horizontalpodautoscaler_spec_max_replicas
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "HPA {{ $labels.namespace }}/{{ $labels.horizontalpodautoscaler }} is maxed out"
            description: >-
              HorizontalPodAutoscaler {{ $labels.namespace }}/{{ $labels.horizontalpodautoscaler }}
              has been running at its maximum replica count ({{ $value }}) for 15 minutes.
              Demand may be exceeding capacity — consider raising autoscaling.maxReplicas in
              charts/api/values-production.yaml.
